plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tikitaka'
version = '0.0.1-SNAPSHOT'
description = 'bidwin-back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
    implementation 'io.github.openfeign.querydsl:querydsl-sql:7.5'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.47.6')
    implementation 'software.amazon.awssdk:s3'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 순수 spring-session-data-redis만으로는 Boot의 자동설정(글루 코드)이 빠져서
    // SessionRepository 빈이 전혀 안 만들어진다. Boot 스타터를 써야 실제로 활성화된다.
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 main()을 거치지 않아 TimeZone.setDefault가 적용되지 않으므로, CI 러너의
    // 기본 시간대와 무관하게 시각 관련 검증이 흔들리지 않도록 여기서 서울로 고정한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
