spring:
  application:
    name: bidwin-back
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 이름 기반 time zone은 MySQL time zone table이 비어 있으면 연결부터 실패한다.
    # +09:00 세션 오프셋으로 DB 시각과 서비스의 Asia/Seoul 변환 기준을 맞춘다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/bidwin?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    hikari:
      # t3.micro(vCPU 2) 기준 HikariCP 권장 공식: (core_count * 2) + effective_spindle_count
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
  flyway:
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 로컬/테스트는 비밀번호 없는 Redis를 그대로 쓰도록 기본값을 빈 문자열로 둔다.
      password: ${REDIS_PASSWORD:}
      # Redis는 보조 캐시라 응답이 없어도(먹통) 빠르게 실패해서 MySQL로 넘어가야 한다.
      # 기본값(수십 초)대로 두면 그 시간만큼 톰캣 스레드가 묶여, 보조 캐시 장애가
      # 입찰 API 전체 지연/고갈로 번질 수 있다.
      # 세션 저장소도 같은 커넥션 설정을 공유하므로, 세션 조회도 동일하게 빠르게 실패한다.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:300ms}
  session:
    store-type: redis
    # 유휴 만료. 활동이 없으면 이 시간 뒤 자동 로그아웃(Redis TTL로 처리).
    # 절대 만료(로그인 후 경과 시간)는 SessionAuthenticationFilter가 별도로 검사한다.
    timeout: ${SESSION_IDLE_TIMEOUT:3h}
    # flush mode(즉시 반영 여부)는 이 프로퍼티로는 안 먹혀서 SessionConfig의 커스터마이저로 설정한다.

server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      # t4g.micro(RAM 1GiB)에서 기본값 200은 쓰레드 스택만으로 ~200MB를 차지해 부담스럽다.
      max: ${TOMCAT_THREADS_MAX:100}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        # Spring Session 도입 전과 쿠키 이름을 동일하게 유지한다
        # (기본값 SESSION으로 바뀌면 기존 클라이언트/인프라 설정이 깨질 수 있음).
        name: JSESSIONID
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: []

app:
  auction:
    closing-interval: ${AUCTION_CLOSING_INTERVAL:1s}
    down-price-snapshot-interval: ${AUCTION_DOWN_PRICE_SNAPSHOT_INTERVAL:1m}
    down-price-snapshot-retention: ${AUCTION_DOWN_PRICE_SNAPSHOT_RETENTION:10m}
  mail:
    rate-limit:
      cooldown: ${MAIL_RATE_LIMIT_COOLDOWN:1m}
      window: ${MAIL_RATE_LIMIT_WINDOW:15m}
      max-count: ${MAIL_RATE_LIMIT_MAX_COUNT:5}
  sse:
    connection-timeout-ms: ${SSE_CONNECTION_TIMEOUT_MS:300000}
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:15000}
    reconnect-time-ms: ${SSE_RECONNECT_TIME_MS:3000}
    max-channels-per-connection: ${SSE_MAX_CHANNELS_PER_CONNECTION:50}
    max-pending-messages-per-connection: ${SSE_MAX_PENDING_MESSAGES_PER_CONNECTION:100}

  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset/confirm}
  email-verification:
    url: ${EMAIL_VERIFICATION_URL:http://localhost:5173/email-verification}

  storage:
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN:http://localhost:8080}
    s3:
      bucket: ${AWS_S3_BUCKET:bidwin-local}
      region: ${AWS_REGION:ap-northeast-2}
      presign-duration: ${AWS_S3_PRESIGN_DURATION:5m}
      pending-auction-image:
        retention: ${PENDING_AUCTION_IMAGE_RETENTION:24h}
        cleanup-interval: ${PENDING_AUCTION_IMAGE_CLEANUP_INTERVAL:1h}
        cleanup-batch-size: ${PENDING_AUCTION_IMAGE_CLEANUP_BATCH_SIZE:1000}
      pending-profile-image:
        retention: ${PENDING_PROFILE_IMAGE_RETENTION:24h}
        cleanup-interval: ${PENDING_PROFILE_IMAGE_CLEANUP_INTERVAL:1h}
        cleanup-batch-size: ${PENDING_PROFILE_IMAGE_CLEANUP_BATCH_SIZE:100}
