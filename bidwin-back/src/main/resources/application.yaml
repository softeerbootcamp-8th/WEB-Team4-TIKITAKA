spring:
  application:
    name: bidwin-back
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset}
