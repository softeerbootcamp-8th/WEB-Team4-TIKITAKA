spring:
  application:
    name: bidwin-back
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
    # serverTimezone은 드라이버 변환 기준일 뿐 MySQL 세션 time_zone을 바꾸지 않는다.
    # SYSDATE(6)/current_timestamp()가 세션 시간대로 평가되므로, 세션까지 Asia/Seoul로
    # 강제해 감사 시각과 마감 판정, epoch 변환이 서로 어긋나지 않게 한다.
    url: jdbc:mysql://localhost:3306/bidwin?serverTimezone=Asia/Seoul&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  jpa:
    hibernate:
      # 스키마 변경은 Flyway만 담당하고 Hibernate는 매핑 불일치만 검증한다.
      ddl-auto: validate

server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
        path: /

app:
  auction:
    closing-interval: ${AUCTION_CLOSING_INTERVAL:1s}
  mail:
    rate-limit:
      cooldown: ${MAIL_RATE_LIMIT_COOLDOWN:1m}
      window: ${MAIL_RATE_LIMIT_WINDOW:15m}
      max-count: ${MAIL_RATE_LIMIT_MAX_COUNT:5}
  sse:
    connection-timeout-ms: ${SSE_CONNECTION_TIMEOUT_MS:300000}
    heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:15000}
    reconnect-time-ms: ${SSE_RECONNECT_TIME_MS:3000}
    max-channels-per-connection: ${SSE_MAX_CHANNELS_PER_CONNECTION:50}
    max-pending-messages-per-connection: ${SSE_MAX_PENDING_MESSAGES_PER_CONNECTION:100}

  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset/confirm}
  email-verification:
    url: ${EMAIL_VERIFICATION_URL:http://localhost:5173/email-verification}

  storage:
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN:http://localhost:8080}
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      presign-duration: ${AWS_S3_PRESIGN_DURATION:5m}
      pending-auction-image:
        retention: ${PENDING_AUCTION_IMAGE_RETENTION:24h}
        cleanup-interval: ${PENDING_AUCTION_IMAGE_CLEANUP_INTERVAL:1h}
        cleanup-batch-size: ${PENDING_AUCTION_IMAGE_CLEANUP_BATCH_SIZE:1000}
      pending-profile-image:
        retention: ${PENDING_PROFILE_IMAGE_RETENTION:24h}
        cleanup-interval: ${PENDING_PROFILE_IMAGE_CLEANUP_INTERVAL:1h}
        cleanup-batch-size: ${PENDING_PROFILE_IMAGE_CLEANUP_BATCH_SIZE:100}
