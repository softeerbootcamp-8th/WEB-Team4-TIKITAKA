name: Build and test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  # PR 검증은 최신 커밋만 남기되, 운영 배포는 중간 취소로 일부만 반영되지 않게 직렬화한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidwin-front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bidwin-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.bidwin.site
        run: npm run build
      - name: Test
        run: npm test --if-present
      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: bidwin-front/dist
          if-no-files-found: error

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: bidwin-back
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bidwin
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      # PR 코드는 주입된 값을 읽을 수 있으므로 운영 자격 증명이 아닌 테스트 전용 값만 저장한다.
      - name: Load backend test environment
        env:
          BACKEND_TEST_ENV: ${{ secrets.BACKEND_TEST_ENV }}
        run: |
          if [ -z "$BACKEND_TEST_ENV" ]; then
            echo "::error::BACKEND_TEST_ENV repository secret is required."
            exit 1
          fi
          printf '%s\n' "$BACKEND_TEST_ENV" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build and test
        id: backend-build
        continue-on-error: true
        run: ./gradlew clean build --no-daemon
      - name: Upload backend artifact
        if: github.event_name == 'push' && steps.backend-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: backend
          path: |
            bidwin-back/build/libs/*.jar
            !bidwin-back/build/libs/*-plain.jar
          if-no-files-found: error
      - name: Comment test result
        if: >-
          always()
          && github.event_name == 'pull_request'
          && steps.backend-build.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- backend-test-coverage -->";
            const testReportDirectory =
              "bidwin-back/build/test-results/test";
            const testReportFiles = fs.existsSync(testReportDirectory)
              ? fs.readdirSync(testReportDirectory)
                  .filter(file => file.endsWith(".xml"))
              : [];

            function numberAttribute(tag, name) {
              return Number(
                tag.match(new RegExp(`${name}="(\\d+)"`))?.[1] ?? 0
              );
            }

            function textAttribute(attributes, name) {
              const value =
                attributes.match(new RegExp(`${name}="([^"]*)"`))?.[1]
                ?? "알 수 없음";
              const entities = {
                "&amp;": "&",
                "&quot;": "\"",
                "&apos;": "'",
                "&lt;": "<",
                "&gt;": ">"
              };
              return value.replace(
                /&(amp|quot|apos|lt|gt);/g,
                entity => entities[entity]
              );
            }

            const tests = {
              total: 0,
              skipped: 0,
              failed: 0,
              successful: 0
            };
            const failedTests = [];

            for (const file of testReportFiles) {
              const xml = fs.readFileSync(
                `${testReportDirectory}/${file}`,
                "utf8"
              );
              const testSuite = xml.match(/<testsuite\b[^>]*>/)?.[0];
              if (testSuite) {
                const total = numberAttribute(testSuite, "tests");
                const skipped = numberAttribute(testSuite, "skipped");
                const failed =
                  numberAttribute(testSuite, "failures")
                  + numberAttribute(testSuite, "errors");
                tests.total += total;
                tests.skipped += skipped;
                tests.failed += failed;
                tests.successful += total - skipped - failed;
              }

              for (const testCase of xml.matchAll(
                /<testcase\b([^>]*?)(?<!\/)>([\s\S]*?)<\/testcase>/g
              )) {
                if (!/<(?:failure|error)\b/.test(testCase[2])) {
                  continue;
                }
                const className = textAttribute(testCase[1], "classname");
                const testName = textAttribute(testCase[1], "name");
                failedTests.push(
                  `${className}#${testName}`.replaceAll("`", "'")
                );
              }
            }

            const failedTestList = failedTests.length === 0
              ? testReportFiles.length === 0
                ? "- 테스트 결과 파일이 생성되지 않았습니다."
                : "- 없음"
              : failedTests.map(test => `- \`${test}\``).join("\n");

            const coverageReport =
              "bidwin-back/build/reports/jacoco/test/jacocoTestReport.xml";
            const coverageXml = fs.existsSync(coverageReport)
              ? fs.readFileSync(coverageReport, "utf8")
              : "";

            function coverage(type) {
              const pattern = new RegExp(
                `<counter type="${type}" missed="(\\d+)" covered="(\\d+)"\\s*/>`,
                "g"
              );
              const counter = [...coverageXml.matchAll(pattern)].at(-1);
              if (!counter) {
                return "측정 불가";
              }

              const missed = Number(counter[1]);
              const covered = Number(counter[2]);
              const total = missed + covered;
              const percent = total === 0
                ? "0.00"
                : ((covered / total) * 100).toFixed(2);
              return `${percent}% (${covered}/${total})`;
            }

            const body = `${marker}
            ## 백엔드 테스트 결과
            - 전체 ${tests.total}개
            - 성공 ${tests.successful}개
            - 실패 ${tests.failed}개
            - 건너뜀 ${tests.skipped}개

            ### 실패한 테스트
            ${failedTestList}

            ## 테스트 커버리지
            현재 pr 기준 백엔드 테스트 커버리지는 아래와 같습니다.
            - 클래스 ${coverage("CLASS")}
            - 메서드 ${coverage("METHOD")}
            - 줄 ${coverage("LINE")}
            - 브랜치(분기) ${coverage("BRANCH")}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              }
            );
            const previous = comments.find(
              comment =>
                comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      # 코멘트 작성을 위해 보류했던 Gradle 실패를 job 결과에 다시 반영한다.
      - name: Fail when backend build or tests fail
        if: always() && steps.backend-build.outcome == 'failure'
        run: exit 1

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      failure_reason: ${{ steps.reason.outputs.reason }}
      failure_detail: ${{ steps.reason.outputs.detail }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      FRONTEND_S3_URI: ${{ vars.FRONTEND_S3_URI }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      BACKEND_SERVICE_NAME: bidwin.service
    steps:
      - id: download-backend
        uses: actions/download-artifact@v8
        with:
          name: backend
          path: backend-artifact
      - id: download-frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: frontend-artifact
      - name: Validate deployment configuration
        id: validate
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          : "${AWS_DEFAULT_REGION:?Set the AWS_REGION variable}"
          : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN variable}"
          : "${FRONTEND_S3_URI:?Set the FRONTEND_S3_URI variable}"
          : "${EC2_HOST:?Set the EC2_HOST variable}"
          : "${EC2_USER:?Set the EC2_USER variable}"
          : "${BACKEND_DEPLOY_PATH:?Set the BACKEND_DEPLOY_PATH variable}"
          # 재시작 후 헬스체크가 배포 성공의 판정 기준이므로 URL 누락을 조용히 넘기지 않는다.
          : "${BACKEND_HEALTH_URL:?Set the BACKEND_HEALTH_URL variable}"
          : "${EC2_SSH_PRIVATE_KEY:?Set the EC2_SSH_PRIVATE_KEY secret}"
          : "${EC2_KNOWN_HOSTS:?Set the EC2_KNOWN_HOSTS secret}"
      - name: Prepare SSH credentials
        id: ssh-credentials
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          key_file="$RUNNER_TEMP/bidwin-deploy.pem"
          known_hosts_file="$RUNNER_TEMP/known_hosts"
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          {
            echo "SSH_KEY_FILE=$key_file"
            echo "SSH_KNOWN_HOSTS_FILE=$known_hosts_file"
          } >> "$GITHUB_ENV"
      - name: Upload backend jar
        id: upload-jar
        run: |
          scp \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            backend-artifact/*.jar \
            "$EC2_USER@$EC2_HOST:$BACKEND_DEPLOY_PATH"
      - name: Restart backend service
        id: restart-service
        run: |
          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "set -e
             sudo -n systemctl restart '$BACKEND_SERVICE_NAME'
             sudo -n systemctl is-active --quiet '$BACKEND_SERVICE_NAME'"
      - name: Check backend health
        id: health-check
        run: |
          # 재시작 직후에는 스프링 부트 기동이 끝나지 않으므로 최대 90초까지 재시도한다.
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 18 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 10 \
            --output /dev/null \
            "$BACKEND_HEALTH_URL"
      - name: Configure AWS credentials
        id: configure-aws
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: Deploy frontend
        id: deploy-frontend
        run: |
          # ponytail: 전체 파일을 재검증하도록 두고, 트래픽이 커지면 해시 자산만 장기 캐시한다.
          aws s3 sync frontend-artifact/ "$FRONTEND_S3_URI" \
            --cache-control "no-cache"
      - name: Collect backend diagnostics
        id: diagnostics
        if: >-
          always()
          && (steps.restart-service.outcome == 'failure'
            || steps.health-check.outcome == 'failure')
        continue-on-error: true
        run: |
          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "sudo -n systemctl is-active '$BACKEND_SERVICE_NAME' || true
             sudo -n journalctl -u '$BACKEND_SERVICE_NAME' --no-pager --lines=20 \
               2>/dev/null \
               || journalctl -u '$BACKEND_SERVICE_NAME' --no-pager --lines=20 \
               || true" \
            > "$RUNNER_TEMP/diagnostics.log" 2>&1 || true
          echo "::group::bidwin.service 진단 로그"
          cat "$RUNNER_TEMP/diagnostics.log"
          echo "::endgroup::"
      # 실패한 첫 단계를 사유 문구로 바꿔 Slack 알림 잡으로 넘긴다.
      - name: Resolve failure reason
        id: reason
        if: always()
        env:
          OUTCOME_DOWNLOAD_BACKEND: ${{ steps.download-backend.outcome }}
          OUTCOME_DOWNLOAD_FRONTEND: ${{ steps.download-frontend.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          OUTCOME_SSH_CREDENTIALS: ${{ steps.ssh-credentials.outcome }}
          OUTCOME_UPLOAD_JAR: ${{ steps.upload-jar.outcome }}
          OUTCOME_RESTART_SERVICE: ${{ steps.restart-service.outcome }}
          OUTCOME_HEALTH_CHECK: ${{ steps.health-check.outcome }}
          OUTCOME_CONFIGURE_AWS: ${{ steps.configure-aws.outcome }}
          OUTCOME_DEPLOY_FRONTEND: ${{ steps.deploy-frontend.outcome }}
        run: |
          reason=""
          for entry in \
            "$OUTCOME_DOWNLOAD_BACKEND|백엔드 아티팩트 다운로드 실패" \
            "$OUTCOME_DOWNLOAD_FRONTEND|프론트엔드 아티팩트 다운로드 실패" \
            "$OUTCOME_VALIDATE|배포 설정(variables/secrets) 검증 실패" \
            "$OUTCOME_SSH_CREDENTIALS|SSH 키 준비 실패" \
            "$OUTCOME_UPLOAD_JAR|EC2로 JAR 전송(scp) 실패" \
            "$OUTCOME_RESTART_SERVICE|bidwin.service 재시작 실패" \
            "$OUTCOME_HEALTH_CHECK|재시작 후 백엔드 헬스체크 실패" \
            "$OUTCOME_CONFIGURE_AWS|AWS 자격 증명 설정 실패" \
            "$OUTCOME_DEPLOY_FRONTEND|프론트엔드 S3 배포 실패"
          do
            if [ "${entry%%|*}" = "failure" ]; then
              reason="${entry#*|}"
              break
            fi
          done
          detail=""
          if [ -n "$reason" ] && [ -s "$RUNNER_TEMP/diagnostics.log" ]; then
            detail="$(head -c 1200 "$RUNNER_TEMP/diagnostics.log")"
          fi
          {
            echo "reason=$reason"
            echo "detail<<DIAGNOSTICS_EOF"
            printf '%s\n' "$detail"
            echo "DIAGNOSTICS_EOF"
          } >> "$GITHUB_OUTPUT"

  notify:
    name: Notify
    if: always() && github.event_name == 'push'
    needs: [frontend, backend, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_REASON: ${{ needs.deploy.outputs.failure_reason }}
          DEPLOY_DETAIL: ${{ needs.deploy.outputs.failure_detail }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set. Skipping the Slack notification."
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success)
              emoji="✅"
              status="배포 성공"
              color="#2eb886"
              ;;
            failure)
              emoji="❌"
              status="배포 실패"
              color="#d63b3b"
              ;;
            cancelled)
              emoji="⚪"
              status="배포 취소"
              color="#9aa0a6"
              ;;
            *)
              emoji="⏭️"
              status="배포 미실행"
              color="#e3a008"
              ;;
          esac

          reason="$DEPLOY_REASON"
          if [ "$DEPLOY_RESULT" != "success" ] && [ -z "$reason" ]; then
            blocked=""
            if [ "$FRONTEND_RESULT" != "success" ]; then
              blocked="프론트엔드 빌드/테스트($FRONTEND_RESULT)"
            fi
            if [ "$BACKEND_RESULT" != "success" ]; then
              blocked="${blocked:+$blocked, }백엔드 빌드/테스트($BACKEND_RESULT)"
            fi
            if [ -n "$blocked" ]; then
              reason="선행 작업 실패로 배포를 실행하지 않았습니다: $blocked"
            else
              reason="원인을 특정하지 못했습니다. 워크플로 로그를 확인해주세요."
            fi
          fi

          detail="$(printf '%s' "$DEPLOY_DETAIL" | head -c 1200)"
          subject="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          payload="$(jq -n \
            --arg emoji "$emoji" \
            --arg status "$status" \
            --arg color "$color" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg subject "$subject" \
            --arg actor "$GITHUB_ACTOR" \
            --arg reason "$reason" \
            --arg detail "$detail" \
            --arg url "$run_url" \
            '{
              text: "\($emoji) \($repository) \($status)",
              attachments: [{
                color: $color,
                blocks: (
                  [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: "*\($emoji) \($status)*  <\($url)|워크플로 실행 보기>"
                      }
                    },
                    {
                      type: "section",
                      fields: [
                        { type: "mrkdwn", text: "*리포지토리*\n\($repository)" },
                        { type: "mrkdwn", text: "*브랜치*\n\($branch)" },
                        { type: "mrkdwn", text: "*커밋*\n`\($sha)` \($subject)" },
                        { type: "mrkdwn", text: "*실행자*\n\($actor)" }
                      ]
                    }
                  ]
                  + (if $reason == "" then [] else [{
                      type: "section",
                      text: { type: "mrkdwn", text: "*사유*\n\($reason)" }
                    }] end)
                  + (if ($detail | gsub("\\s"; "")) == "" then [] else [{
                      type: "section",
                      text: { type: "mrkdwn", text: "*진단 로그*\n```\($detail)```" }
                    }] end)
                )
              }]
            }')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
