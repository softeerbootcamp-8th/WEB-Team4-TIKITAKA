name: Build and test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidwin-front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bidwin-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --if-present

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: bidwin-back
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bidwin
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      # PR 코드는 주입된 값을 읽을 수 있으므로 운영 자격 증명이 아닌 테스트 전용 값만 저장한다.
      - name: Load backend test environment
        env:
          BACKEND_TEST_ENV: ${{ secrets.BACKEND_TEST_ENV }}
        run: |
          if [ -z "$BACKEND_TEST_ENV" ]; then
            echo "::error::BACKEND_TEST_ENV repository secret is required."
            exit 1
          fi
          printf '%s\n' "$BACKEND_TEST_ENV" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build and test
        run: ./gradlew clean build --no-daemon
      - name: Comment test coverage
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- backend-test-coverage -->";
            const xml = fs.readFileSync(
              "bidwin-back/build/reports/jacoco/test/jacocoTestReport.xml",
              "utf8"
            );

            function coverage(type) {
              const pattern = new RegExp(
                `<counter type="${type}" missed="(\\d+)" covered="(\\d+)"\\s*/>`,
                "g"
              );
              const counter = [...xml.matchAll(pattern)].at(-1);
              if (!counter) {
                throw new Error(`JaCoCo ${type} counter not found`);
              }

              const missed = Number(counter[1]);
              const covered = Number(counter[2]);
              const total = missed + covered;
              const percent = total === 0
                ? "0.00"
                : ((covered / total) * 100).toFixed(2);
              return `${percent}% (${covered}/${total})`;
            }

            const body = `${marker}
            ## 테스트 커버리지
            현재 pr 기준 백엔드 테스트 커버리지는 아래와 같습니다.
            - 클래스 ${coverage("CLASS")}
            - 메서드 ${coverage("METHOD")}
            - 줄 ${coverage("LINE")}
            - 브랜치(분기) ${coverage("BRANCH")}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              }
            );
            const previous = comments.find(
              comment =>
                comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
