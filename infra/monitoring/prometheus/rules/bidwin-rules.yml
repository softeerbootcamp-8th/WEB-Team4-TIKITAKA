groups:
  - name: bidwin-recording
    interval: 15s
    rules:
      - record: bidwin:http_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="bidwin-back"}[5m]))
      - record: bidwin:http_errors:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="bidwin-back",status=~"5.."}[5m]))
      - record: bidwin:http_error_ratio:rate5m
        expr: bidwin:http_errors:rate5m / clamp_min(bidwin:http_requests:rate5m, 0.001)
      - record: bidwin:http_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="bidwin-back"}[5m])))
      - record: bidwin:jvm_heap:usage_ratio
        expr: sum(jvm_memory_used_bytes{application="bidwin-back",area="heap"}) / clamp_min(sum(jvm_memory_max_bytes{application="bidwin-back",area="heap"}), 1)
      - record: bidwin:hikari:usage_ratio
        expr: sum(hikaricp_connections_active{application="bidwin-back"}) / clamp_min(sum(hikaricp_connections_max{application="bidwin-back"}), 1)
      - record: bidwin:host_cpu:usage_ratio
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: bidwin:host_memory:usage_ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

  - name: bidwin-alerts
    rules:
      - alert: BidwinApplicationDown
        expr: up{job="bidwin-back"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Bidwin 애플리케이션을 수집할 수 없습니다.
      - alert: BidwinHighHttpErrorRate
        expr: bidwin:http_error_ratio:rate5m > 0.05 and bidwin:http_requests:rate5m > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 최근 5분 HTTP 5xx 비율이 5%를 넘었습니다.
      - alert: BidwinHighHttpLatency
        expr: bidwin:http_latency:p95_5m > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 최근 5분 HTTP p95 응답시간이 1초를 넘었습니다.
      - alert: BidwinHikariPoolExhausted
        expr: hikaricp_connections_pending{application="bidwin-back"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Hikari 커넥션 대기가 2분 이상 지속되고 있습니다.
      - alert: BidwinJvmHeapHigh
        expr: bidwin:jvm_heap:usage_ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: JVM heap 사용률이 10분 이상 85%를 넘었습니다.
      - alert: BidwinMysqlDeadlock
        expr: increase(mysql_global_status_innodb_deadlocks[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 최근 5분 MySQL deadlock이 발생했습니다.
      - alert: BidwinMysqlLockWait
        expr: mysql_global_status_innodb_row_lock_current_waits > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: MySQL 행 락 대기가 1분 이상 지속되고 있습니다.
      - alert: BidwinHostResourceHigh
        expr: bidwin:host_cpu:usage_ratio > 0.9 or bidwin:host_memory:usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 호스트 CPU 또는 RAM 사용률이 10분 이상 90%를 넘었습니다.
