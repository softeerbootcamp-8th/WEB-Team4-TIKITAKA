auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

ingester:
  lifecycler:
    # 단일 노드 로컬 환경에는 롤링 배포를 위한 readiness 유예가 필요하지 않다.
    min_ready_duration: 0s

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
