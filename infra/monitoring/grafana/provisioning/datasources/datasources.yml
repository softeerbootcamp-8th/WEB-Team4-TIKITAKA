apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: MySQL Performance Schema
    uid: mysql-performance-schema
    type: mysql
    access: proxy
    url: mysql:3306
    user: grafana_reader
    database: performance_schema
    secureJsonData:
      # $VAR 형식은 비밀번호 안의 '$'가 Grafana에서 다시 확장되는 것을 막는다.
      password: $MYSQL_GRAFANA_PASSWORD
    jsonData:
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 14400
    editable: false
